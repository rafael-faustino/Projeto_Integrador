<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site Customizado</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE INÍCIO -->
    <section id="tela-inicio" class="tela ativa">
        <div class="conteudo-centro">
            <h1>Bem-vindo ao Projeto</h1>
            <p>Clique abaixo para acessar o painel de controle.</p>
            <button class="btn-principal" onclick="mudarTela('tela-opcoes')">Entrar</button>
        </div>
    </section>

    <!-- TELA DE OPÇÕES -->
    <section id="tela-opcoes" class="tela">
        <div class="conteudo-centro">
            <h2>Painel de Opções</h2>
            <div class="grade-opcoes">
                <button class="btn-opcao" onclick="mudarTela('tela-corpo')">Visualizar Corpo Específico</button>
                <button class="btn-opcao" onclick="alert('Opção 2 clicada!')">Configurações</button>
                <button class="btn-opcao" onclick="alert('Opção 3 clicada!')">Suporte</button>
            </div>
            <button class="btn-voltar" onclick="mudarTela('tela-inicio')">← Voltar ao Início</button>
        </div>
    </section>

    <!-- O CORPO ESPECÍFICO -->
    <main id="tela-corpo" class="tela">
        <header class="topo-corpo">
            <h2>Seu Espaço Customizado</h2>
            <button class="btn-voltar" onclick="mudarTela('tela-opcoes')">← Menu de Opções</button>
        </header>
        
        <!-- O layout que você quer do seu jeito vai entrar nesta div -->
        <div class="container-customizado">
            <p>Esta é a área que vamos moldar exatamente do jeito específico que você precisa.</p>
        </div>
    </main>

    <!-- Script de navegação -->
    <script>
        function mudarTela(idNovaTela) {
            document.querySelectorAll('.tela').forEach(tela => {
                tela.classList.remove('ativa');
            });
            document.getElementById(idNovaTela).classList.add('ativa');
        }
    </script>
</body>
</html>
