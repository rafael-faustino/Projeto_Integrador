<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Pokémon - Entrada</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PORTA DE ENTRADA (FACHADA DO MENU) -->
    <div class="centro-pokemon-fachada" id="fachada">
        <div class="topo-vermelho">CENTRO POKÉMON</div>
        
        <div class="menu-entrada">
            <!-- Adicionamos IDs para o JavaScript reconhecer qual botão foi clicado -->
            <button class="btn-entrar" id="btn-entrar">Entrar no Centro</button>
            <button class="btn-entrar" id="btn-curar">Curar Pokémons</button>
            <button class="btn-entrar" id="btn-pc">Acessar PC de Bill</button>
        </div>
    </div>

    <!-- INTERIOR DO CENTRO POKÉMON -->
    <div class="interior-centro" id="interior">
        <h1 id="titulo-interior">Bem-vindo ao Centro Pokémon!</h1>
        <p id="mensagem-interior">Aguarde um instante...</p>
    </div>

    <!-- Vinculando o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
