<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Pokebola</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }

        /* Container Principal */
        .cena { position: relative; width: 200px; height: 200px; transition: transform 1s ease-in; }

        /* Efeito de Zoom no Corpo do Site */
        .zoom-background { transform: scale(5); filter: brightness(2); }

        /* Estilização Base da Pokebola */
        .pokebola { width: 100%; height: 100%; position: relative; cursor: pointer; }
        .metade { position: absolute; width: 100%; height: 50%; left: 0; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); border: 8px solid #000; }
        .topo { top: 0; background: #ff1c1c; border-radius: 100px 100px 0 0; }
        .base { bottom: 0; background: #fff; border-radius: 0 0 100px 100px; }

        /* Botão Central */
        .botao-central { position: absolute; width: 50px; height: 50px; background: #fff; border: 8px solid #000; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; transition: all 0.5s; }
        .botao-central::before { content: ''; position: absolute; width: 20px; height: 20px; background: #fff; border: 2px solid #ccc; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        /* Classes de Animação (Ativadas por JS) */
        .abrir .topo { transform: translateY(-120px); }
        .abrir .base { transform: translateY(120px); }
        .abrir .botao-central { opacity: 0; transform: translate(-50%, -50%) scale(0); }

        /* O Raio que puxa o usuário */
        .raio-luz { position: fixed; top: 50%; left: 50%; width: 10px; height: 10px; background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(0,183,255,1) 50%, rgba(0,0,0,0) 70%); border-radius: 50%; transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none; z-index: 999; transition: transform 0.8s ease-in, opacity 0.4s ease-in; }
        .raio-ativo { transform: translate(-50%, -50%) scale(300); opacity: 1; }
    </style>
</head>
<body>

    <div class="cena" id="canvas">
        <div class="pokebola" id="pokebola" onclick="capturar()">
            <div class="metade topo"></div>
            <div class="botao-central"></div>
            <div class="metade base"></div>
        </div>
    </div>

    <div class="raio-luz" id="raio"></div>

    <script>
        function capturar() {
            const pokebola = document.getElementById('pokebola');
            const raio = document.getElementById('raio');
            const canvas = document.getElementById('canvas');

            // 1. Abre a pokebola
            pokebola.classList.add('abrir');

            // 2. Dispara o raio e o efeito de puxar após um pequeno delay
            setTimeout(() => {
                raio.classList.add('raio-ativo');
                canvas.classList.add('zoom-background');
            }, 300);

            // 3. Redireciona para o menu real após a tela ficar totalmente coberta
            setTimeout(() => {
                // Substitua pelo link da sua página de menu interna
                // window.location.href = "menu.html"; 
                alert("Você foi puxado para dentro do menu!");
            }, 1100);
        }
    </script>
</body>
</html>
