    <!-- O CORPO ESPECÍFICO -->
    <main id="tela-corpo" class="tela">
        <!-- Botão flutuante para conseguir voltar caso queira -->
        <button class="btn-voltar-flutuante" onclick="mudarTela('tela-opcoes')">← Menu</button>
        
        <!-- Metade Superior (Vermelha) -->
        <div class="metade-superior">
            <!-- Animação do Raio Caindo -->
            <div class="raio-container">
                <svg class="raio" viewBox="0 0 100 200" preserveAspectRatio="none">
                    <polyline points="50,0 30,80 65,75 35,140 55,135 25,200" />
                </svg>
            </div>
        </div>

        <!-- Listra Preta Central -->
        <div class="listra-preta">
            <!-- O botão central da esfera -->
            <div class="esfera-botao"></div>
        </div>

        <!-- Metade Inferior (Branca) -->
        <div class="metade-inferior">
            <!-- O conteúdo do seu site vai aparecer aqui dentro após a abertura -->
            <div class="conteudo-site">
                <h2>Seu Espaço Customizado</h2>
                <p>Aqui você pode colocar seus textos, imagens e dados.</p>
            </div>
        </div>
    </main>
