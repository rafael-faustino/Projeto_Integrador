<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Integrador - Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- FASE 1: TELA PRETA DE ENTRADA -->
    <div id="telaIntro" class="tela-intro">
        <div class="intro-box">
            <h1 class="txt-pixel">SISTEMA POKÉDEX</h1>
            <p class="txt-sub">APERTE QUALQUER LUGAR NA POKÉBOLA PARA INICIAR</p>
            
            <!-- Corpo da Pokébola -->
            <div id="pokebola" class="pokebola" onclick="dispararCaptura()">
                <div class="linha-central"></div>
                <div class="botao-central"></div>
            </div>
        </div>
        
        <!-- O Raio de energia que vai se expandir e sugar a tela -->
        <div id="raioSugador" class="raio-sugador"></div>
    </div>

    <!-- FASE 2: CONSOLE PRINCIPAL (INICIA ESCONDIDO) -->
    <div id="pokedexApp" class="pokedex-app escondido">
        <div class="pokedex-moldura">
            <div class="led-principal"></div>
            <div class="visor-mensagem">
                <p>&gt; CAPTURA CONCLUÍDA COM SUCESSO!</p>
                <p>&gt; Treinador inserido no banco de dados da Óptica.</p>
            </div>
            
            <!-- Menu temporário só para validar a entrada -->
            <div class="menu-teste">
                <button class="btn-rota">⚡ Rota 01</button>
                <button class="btn-rota">🌙 Rota 02</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
